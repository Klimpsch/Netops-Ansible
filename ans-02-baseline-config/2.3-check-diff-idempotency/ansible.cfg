[defaults]
inventory = ./hosts.yaml
host_key_checking = False
gathering = explicit
forks = 10
timeout = 30
retry_files_enabled = False
interpreter_python = auto_silent

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[paramiko_connection]
host_key_auto_add = True


