---
# Grab software version, model and serial from each router and print them.
- name: Print hostname, model version
  hosts: routers
  gather_facts: false

  tasks:
    - name: Gather Basic facts
      cisco.ios.ios_facts:
        gather_subset: min
      register: facts

    - name: Print Summary
      ansible.builtin.debug:
        msg: >-
          {{ facts.ansible_facts.ansible_net_hostname }}
          {{ facts.ansible_facts.ansible_net_model }} | 
          {{ facts.ansible_facts.ansible_net_version }} 