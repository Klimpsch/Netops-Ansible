---
# Grab software version, model and serial from each router and print them.
- name: Grab router versions
  hosts: routers
  gather_facts: false

  tasks:
    - name: Gather minimal device facts
      cisco.ios.ios_facts:
        gather_subset:
          - min
          - interfaces

    - name: Show cdp neighbors
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} {{ item.0.key }} ->
          {{ item.1.host }} {{ item.1.port }}
          ({{ item.1.ip | default('no ip') }})
      loop: "{{ ansible_facts.net_neighbors | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.0.key }}"
