---
# Grab software version, model and serial from each router and print them.
- name: Grab CDP neighbors
  hosts: routers
  gather_facts: false

  tasks:
    - name: Gather interfaces details
      cisco.ios.ios_facts:
        gather_subset:
          - interfaces


    - name: Write neighbors to CSV
      ansible.builtin.copy:
        dest: ./cdp_neighbors.csv
        content: |
          device,local_interface,neighbor,neighbor_ip,neighbor_port,platform
          {% for h in ansible_play_hosts %}
          {% for intf, nbrs in (hostvars[h].ansible_facts.net_neighbors | default({})).items() %}
          {% for n in nbrs %}
          {{ h }},{{ intf }},{{ n.host }},{{ n.ip | default('', true) }},{{ n.port }},{{ n.platform | default('', true) }}
          {% endfor %}
          {% endfor %}
          {% endfor %}
      delegate_to: localhost
      run_once: true

